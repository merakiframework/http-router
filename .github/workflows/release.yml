name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write    # required for softprops/action-gh-release to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Extract release notes from CHANGELOG.md
        run: php scripts/extract-changelog.php "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # Mark pre-release for tags like v1.0.0-alpha.1 / v1.0.0-rc.2
          prerelease: ${{ contains(github.ref_name, '-') }}
